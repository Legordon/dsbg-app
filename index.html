<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ashen Reference</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0908">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dark Souls Ref">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0908;
      --card: #17140f;
      --card-border: #2b2620;
      --ember: #e8590c;
      --ember-bright: #ff8c3c;
      --bone: #e9e1d0;
      --muted: #8d8474;
      --estus: #4f7a52;
      --danger: #8a2c2c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      height: 100%;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--bone);
      font-family: 'Inter', sans-serif;
      min-height: 100dvh;
    }

    #embers {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .ember-particle {
      position: absolute;
      bottom: -10px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--ember-bright);
      box-shadow: 0 0 6px 2px rgba(255, 140, 60, 0.6);
      animation: rise linear infinite;
      opacity: 0;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }

      10% {
        opacity: .9;
      }

      90% {
        opacity: .4;
      }

      100% {
        transform: translateY(-100vh) translateX(var(--drift, 20px));
        opacity: 0;
      }
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      padding: 28px 20px 18px;
      border-bottom: 1px solid var(--card-border);
      text-align: center;
      position: relative;
    }

    header .glow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 120px;
      background: radial-gradient(ellipse at center, rgba(232, 89, 12, 0.25), transparent 70%);
      filter: blur(10px);
      z-index: -1;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 1.5rem;
      margin: 0;
      color: var(--bone);
      text-shadow: 0 0 18px rgba(232, 89, 12, 0.35);
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    main {
      flex: 1;
      padding: 18px 16px 40px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-wrap: wrap;
    }

    .breadcrumb .crumb {
      cursor: pointer;
    }

    .breadcrumb .crumb:hover,
    .breadcrumb .crumb.active {
      color: var(--ember-bright);
    }

    .breadcrumb .sep {
      color: var(--card-border);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }

    /* ---------- Recherche accueil ---------- */
    .search-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .search-wrap input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 38px 12px 14px;
      color: var(--bone);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
    }

    .search-wrap input:focus {
      outline: none;
      border-color: rgba(232, 89, 12, 0.6);
    }

    .search-wrap input::placeholder {
      color: var(--muted);
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--card-border);
      color: var(--bone);
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .search-results-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin: 0 0 10px;
    }

    .search-empty {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 30px 10px;
    }

    .search-input-outer {
      position: relative;
      flex: 1;
    }

    .tile {
      background: linear-gradient(160deg, var(--card), #100e0b);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 18px 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform .15s ease, border-color .15s ease;
      position: relative;
      overflow: hidden;
    }

    .tile:active {
      transform: scale(0.97);
    }

    .tile:hover {
      border-color: rgba(232, 89, 12, 0.5);
    }

    .tile .icon {
      font-size: 1.6rem;
      filter: drop-shadow(0 0 8px rgba(232, 89, 12, 0.4));
    }

    .tile .label {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .tile .sub {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.3;
    }

    .sublist {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sublist li {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: border-color .15s ease;
    }

    .sublist li:active {
      border-color: rgba(232, 89, 12, 0.5);
    }

    .sublist li .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sublist li .emoji {
      font-size: 1.2rem;
      filter: drop-shadow(0 0 6px rgba(232, 89, 12, 0.3));
    }

    .sublist li .name {
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .sublist li .hint {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .sublist li .hint b {
      color: var(--ember-bright);
      font-weight: 700;
    }

    .sublist li .chevron {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .view h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      margin: 0 0 4px;
      color: var(--ember-bright);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin: 20px 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label::before {
      content: "◆";
      color: var(--ember);
      font-size: 0.6rem;
    }

    .checklist {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .checklist li {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .checkmark {
      width: 20px;
      height: 20px;
      min-width: 20px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      transition: all .15s ease;
    }

    .checklist li.done .checkmark {
      background: var(--ember);
      border-color: var(--ember);
      color: #0a0908;
    }

    .checklist li.done {
      border-color: rgba(232, 89, 12, 0.4);
      opacity: 0.75;
    }

    .checklist li.done span.txt {
      text-decoration: line-through;
      text-decoration-color: var(--muted);
    }

    .action {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .action .title {
      font-weight: 600;
      font-size: 0.92rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .action .cost {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      color: var(--ember-bright);
      border: 1px solid rgba(232, 89, 12, 0.4);
      padding: 2px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .action .desc {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 6px;
      border-bottom: 1px solid var(--card-border);
    }

    td {
      padding: 10px 6px;
      border-bottom: 1px solid var(--card-border);
    }

    td.souls {
      color: var(--ember-bright);
      font-family: 'Cinzel', serif;
      white-space: nowrap;
    }

    .note {
      background: rgba(232, 89, 12, 0.06);
      border-left: 3px solid var(--ember);
      padding: 12px 14px;
      font-size: 0.82rem;
      color: var(--bone);
      border-radius: 0 6px 6px 0;
      margin-top: 16px;
      line-height: 1.5;
    }

    .note strong {
      color: var(--ember-bright);
    }

    .note.warn {
      background: rgba(138, 44, 44, 0.1);
      border-left-color: var(--danger);
    }

    .note.warn strong {
      color: #e08a8a;
    }

    .flow {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .flow-step {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--card-border);
    }

    .flow-step:last-child {
      border-bottom: none;
    }

    .flow-num {
      font-family: 'Cinzel', serif;
      color: var(--ember);
      font-weight: 700;
      font-size: 0.85rem;
      width: 22px;
      min-width: 22px;
    }

    .flow-text {
      font-size: 0.87rem;
      line-height: 1.45;
    }

    .flow-text b {
      color: var(--bone);
    }

    .die {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 4px;
      border-radius: 5px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.75rem;
      color: #fff;
      margin: 0 2px;
      vertical-align: middle;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
    }

    .die-noir {
      background: #2b2620;
    }

    .die-bleu {
      background: #2a5c8a;
    }

    .die-orange {
      background: #c9622a;
    }

    .die-vert {
      background: #3f7d4a;
    }

    .mode-toggle {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 4px;
    }

    .mode-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 10px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .mode-btn small {
      display: block;
      font-family: 'Inter';
      font-weight: 500;
      font-size: 0.65rem;
      letter-spacing: 0.3px;
      margin-top: 2px;
      opacity: 0.8;
    }

    .mode-btn.active {
      background: var(--ember);
      color: #0a0908;
    }

    .version-chip {
      display: inline-flex;
      align-items: center;
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: auto;
    }

    .version-chip.v1 {
      color: var(--muted);
      border: 1px solid var(--card-border);
    }

    .version-chip.v2 {
      color: var(--ember-bright);
      border: 1px solid rgba(232, 89, 12, 0.5);
      background: rgba(232, 89, 12, 0.08);
    }

    .tag-v2 {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--ember-bright);
      border: 1px solid rgba(232, 89, 12, 0.5);
      background: rgba(232, 89, 12, 0.08);
      padding: 1px 6px;
      border-radius: 8px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .house-badge {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      color: var(--ember-bright);
      border: 1px solid rgba(232, 89, 12, 0.5);
      background: rgba(232, 89, 12, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .stat-pair {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .stat-box {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .stat-box .lbl {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }

    .stat-box .val {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--ember-bright);
      margin-top: 4px;
    }

    /* ---------- Icônes inline (remplacent les emoji) ---------- */
    .gi {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      vertical-align: -5px;
      margin: 0 2px;
    }

    .gi svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .gi-lg {
      width: 30px;
      height: 30px;
      vertical-align: -8px;
    }

    /* ---------- Bouton glossaire (header) ---------- */
    .glossary-btn {
      position: absolute;
      top: 22px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--ember-bright);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 0 10px rgba(232, 89, 12, 0.15);
    }

    .glossary-btn:active {
      transform: scale(0.93);
    }

    /* ---------- Bouton recherche (header) ---------- */
    .header-search-btn {
      position: absolute;
      top: 22px;
      right: 62px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
    }

    .header-search-btn svg {
      width: 16px;
      height: 16px;
    }

    .header-search-btn:active {
      transform: scale(0.93);
    }

    .header-search-btn.active {
      color: var(--ember-bright);
      border-color: rgba(232, 89, 12, 0.5);
      box-shadow: 0 0 10px rgba(232, 89, 12, 0.15);
    }

    /* ---------- Modale Glossaire ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 4, 3, 0.82);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-bottom: none;
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      transform: translateY(20px);
      transition: transform .2s ease;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-overlay.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .modal-header h2 {
      margin: 0;
      border: none;
      padding: 0;
      font-size: 1.15rem;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--muted);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .modal-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--card-border);
    }

    .modal-tab {
      flex: none;
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--muted);
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      min-width: max-content;
      line-height: 1.3;
    }

    .modal-tab.active {
      background: var(--ember);
      color: #0a0908;
      border-color: var(--ember);
    }

    .modal-body {
      overflow-y: auto;
      padding: 14px 16px 24px;
      flex: 1;
    }

    .glossary-entry {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .glossary-entry .gi-wrap {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 8px;
      background: rgba(232, 89, 12, 0.08);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glossary-entry .gi-wrap svg {
      width: 22px;
      height: 22px;
    }

    .glossary-entry .gtext .gname {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--bone);
      margin-bottom: 2px;
    }

    .glossary-entry .gtext .gdesc {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
    }

    /* ---------- Carte de référence interactive (ennemi) ---------- */
    .refcard-wrap {
      position: relative;
      width: 100%;
      max-width: 340px;
      margin: 0 auto 18px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .refcard-wrap img.refcard-bg {
      width: 100%;
      display: block;
    }

    .refcard-hotspot {
      position: absolute;
      width: var(--hs-w, 34px);
      height: var(--hs-h, 34px);
      border-radius: var(--hs-radius, 50%);
      background: transparent;
      cursor: pointer;
      margin-left: calc(var(--hs-w, 34px) / -2);
      margin-top: calc(var(--hs-h, 34px) / -2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s ease;
      z-index: 5;
    }

    .refcard-hotspot:active {
      background: rgba(232, 89, 12, 0.25);
    }

    .refcard-hotspot .num {
      display: none;
    }

    .refcard-hotspot.highlight {
      background: rgba(255, 140, 60, 0.35);
      box-shadow: 0 0 0 3px rgba(232, 89, 12, 0.6);
    }

    .refcard-overlay-icon {
      display: none;
    }

    .refcard-legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .refcard-legend-item {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
      scroll-margin-top: 12px;
    }

    .refcard-legend-item:active {
      border-color: rgba(232, 89, 12, 0.5);
    }

    .refcard-legend-item.highlight {
      border-color: var(--ember);
      background: rgba(232, 89, 12, 0.08);
    }

    .refcard-legend-item .num-badge {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.8rem;
      color: #0a0908;
      background: var(--ember-bright);
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .refcard-legend-item .ltext .lname {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--bone);
      margin-bottom: 2px;
    }

    .refcard-legend-item .ltext .ldesc {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
    }

    /* ---------- Zoom planche officielle ---------- */
    .planche-preview-wrap {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      cursor: pointer;
    }

    .planche-preview-wrap img {
      width: 100%;
      display: block;
    }

    .planche-preview-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 9, 8, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .15s ease;
    }

    .planche-preview-wrap:active .planche-preview-overlay {
      opacity: 1;
    }

    .planche-preview-overlay span {
      background: rgba(10, 9, 8, 0.85);
      color: var(--bone);
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--ember);
    }

    .planche-expanded-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .planche-back-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ember-bright);
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .planche-zoom-wrap {
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #000;
      touch-action: none;
    }

    .planche-zoom-wrap img {
      width: 100%;
      display: block;
      transform-origin: 0 0;
      transition: transform .05s linear;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>

    // ---------- Zoom pincer/molette pour la planche officielle ----------
    function setupPlancheZoom() {
      const wrap = document.getElementById('planche-zoom-wrap');
      const img = document.getElementById('planche-img');
      if (!wrap || !img) return;
      let scale = 1, originX = 0, originY = 0;
      let isPanning = false, startX = 0, startY = 0;
      let lastDist = null;

      function apply() {
        img.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`;
      }

      wrap.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 1.15 : 0.87;
        scale = Math.min(5, Math.max(1, scale * delta));
        if (scale === 1) { originX = 0; originY = 0; }
        apply();
      }, { passive: false });

      wrap.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          lastDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        } else if (e.touches.length === 1 && scale > 1) {
          isPanning = true;
          startX = e.touches[0].clientX - originX;
          startY = e.touches[0].clientY - originY;
        }
      }, { passive: true });

      wrap.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (lastDist) {
            const delta = dist / lastDist;
            scale = Math.min(5, Math.max(1, scale * delta));
            if (scale === 1) { originX = 0; originY = 0; }
            apply();
          }
          lastDist = dist;
        } else if (e.touches.length === 1 && isPanning) {
          e.preventDefault();
          originX = e.touches[0].clientX - startX;
          originY = e.touches[0].clientY - startY;
          apply();
        }
      }, { passive: false });

      wrap.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) lastDist = null;
        if (e.touches.length === 0) isPanning = false;
      });

      wrap.addEventListener('dblclick', () => {
        scale = 1; originX = 0; originY = 0;
        apply();
      });
    }

              hint: s.hint,
              parentLabel: t.label,
              text: [officialText, houseText].filter(Boolean).join(' — ')
            });
          }
        } else {
          const officialText = htmlToText(renderDirectContent(key));
          const houseText = htmlToText(HOUSE_RULES[key] || '');
          index.push({
            theme: key,
            sub: null,
            label: t.label,
            emoji: t.icon,
            hint: t.sub,
            parentLabel: null,
            text: [officialText, houseText].filter(Boolean).join(' — ')
          });
        }
      }
      return index;
    }

    const SEARCH_INDEX = buildSearchIndex();

    function normalize(str) {
      return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    // Normalise une chaîne tout en gardant, pour chaque caractère normalisé,
    // l'index correspondant dans la chaîne d'origine (pour extraire un extrait fidèle).
    function normalizeWithMap(str) {
      let out = '';
      const map = [];
      for (let i = 0; i < str.length; i++) {
        const decomposed = str[i].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        for (let j = 0; j < decomposed.length; j++) {
          out += decomposed[j];
          map.push(i);
        }
      }
      return { text: out, map };
    }

    function buildSnippet(originalText, normMatchIndex, matchLength, normMap) {
      const startOrig = normMap[normMatchIndex] ?? 0;
      const endNormIndex = Math.min(normMatchIndex + matchLength - 1, normMap.length - 1);
      const endOrig = normMap[endNormIndex] ?? startOrig;
      const radius = 40;
      let from = Math.max(0, startOrig - radius);
      let to = Math.min(originalText.length, endOrig + 1 + radius);
      const before = originalText.slice(from, startOrig);
      const matched = originalText.slice(startOrig, endOrig + 1);
      const after = originalText.slice(endOrig + 1, to);
      return `${from > 0 ? '…' : ''}${escapeAttr(before)}<b>${escapeAttr(matched)}</b>${escapeAttr(after)}${to < originalText.length ? '…' : ''}`;
    }

    let restoreSearchFocus = false;

    function onSearchInput(value) {
      searchQuery = value;
      restoreSearchFocus = true;
      renderHomeBody();
    }

    function clearSearch() {
      searchQuery = '';
      restoreSearchFocus = true;
      renderHomeBody();
    }

    function openSearch() {
      searchOpen = true;
      restoreSearchFocus = true;
      renderHomeBody();
      updateHeaderSearchBtn();
    }

    function closeSearch() {
      searchOpen = false;
      searchQuery = '';
      renderHomeBody();
      updateHeaderSearchBtn();
    }

    function toggleHeaderSearch() {
      const onHome = currentTheme === null;
      if (onHome && searchOpen) {
        closeSearch();
      } else {
        if (!onHome) {
          renderHome();
        }
        openSearch();
      }
    }

    function updateHeaderSearchBtn() {
      const btn = document.getElementById('header-search-btn');
      if (btn) btn.classList.toggle('active', searchOpen);
    }

    function goToSearchResult(theme, sub) {
      if (sub) {
        openSub(theme, sub);
      } else {
        openTheme(theme);
      }
    }

    function renderHome() {
      currentTheme = null; currentCategory = null; currentSubKey = null;
      searchQuery = '';
      searchOpen = false;
      renderHomeBody();
      updateHeaderSearchBtn();
    }

    function renderHomeBody() {
      let html = `<div class="mode-toggle">
    <button class="mode-btn ${currentMode === 'official' ? 'active' : ''}" onclick="setMode('official')">V1<small>Édition 2017</small></button>
    <button class="mode-btn ${currentMode === 'house' ? 'active' : ''}" onclick="setMode('house')">V2<small>Sunless City & co</small></button>
  </div>`;

      if (searchOpen) {
        html += `<div class="search-wrap">
    <div class="search-input-outer">
      <input id="home-search-input" type="text" placeholder="Rechercher une fiche…" value="${escapeAttr(searchQuery)}" oninput="onSearchInput(this.value)">
      ${searchQuery ? `<div class="search-clear" onclick="clearSearch()">✕</div>` : ''}
    </div>
  </div>`;
      }

      const q = normalize(searchQuery.trim());

      if (q.length > 0) {
        const results = SEARCH_INDEX
          .map(item => {
            const labelMatch = normalize(item.label).includes(q);
            const normed = normalizeWithMap(item.text);
            const textMatchIndex = normed.text.indexOf(q);
            if (!labelMatch && textMatchIndex === -1) return null;
            return { item, labelMatch, textMatchIndex, normMap: normed.map };
          })
          .filter(Boolean)
          // Priorité aux correspondances de titre, puis à l'ordre d'apparition dans THEMES
          .sort((a, b) => (b.labelMatch - a.labelMatch));

        if (results.length === 0) {
          html += `<div class="search-empty">Aucune fiche ne correspond à « ${searchQuery} ».</div>`;
        } else {
          html += `<div class="search-results-label">${results.length} résultat${results.length > 1 ? 's' : ''}</div>`;
          html += `<ul class="sublist">`;
          results.forEach(({ item, labelMatch, textMatchIndex, normMap }) => {
            const tag = hasHouseRule(item.theme + (item.sub ? ':' + item.sub : '')) ? `<span class="tag-v2">V2</span>` : '';
            let hintText = item.parentLabel ? `${item.parentLabel} · ${item.hint}` : item.hint;
            if (!labelMatch && textMatchIndex !== -1) {
              hintText = buildSnippet(item.text, textMatchIndex, q.length, normMap);
            }
            html += `
          <li onclick="goToSearchResult('${item.theme}', ${item.sub ? `'${item.sub}'` : 'null'})">
            <div class="left">
              <div class="emoji">${item.emoji}</div>
              <div><div class="name">${item.label}${tag}</div><div class="hint">${hintText}</div></div>
            </div>
            <div class="chevron">›</div>
          </li>`;
          });
          html += `</ul>`;
        }
      } else {
        html += `<div class="grid">`;
        for (const key in THEMES) {
          const t = THEMES[key];
          let tag = '';
          if (t.type === "categories") {
            const anyHouseRule = Object.keys(t.children).some(sk => hasHouseRule(key + ':' + sk));
            tag = anyHouseRule ? `<span class="tag-v2">V2</span>` : '';
          } else {
            tag = hasHouseRule(key) ? `<span class="tag-v2">V2</span>` : '';
          }
          html += `
        <div class="tile" onclick="openTheme('${key}')">
          <div class="icon">${t.icon}</div>
          <div class="label">${t.label}${tag}</div>
          <div class="sub">${t.sub}</div>
        </div>`;
        }
        html += `</div>`;
      }

      document.getElementById('main').innerHTML = html;

      // Restaurer le focus et la position du curseur dans le champ après re-render,
      // sinon chaque frappe fait perdre le focus (innerHTML recrée l'élément).
      if (restoreSearchFocus) {
        const input = document.getElementById('home-search-input');
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
        restoreSearchFocus = false;
      }
    }

    function escapeAttr(str) {
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function hasHouseRule(ficheKey) {
      return !!HOUSE_RULES[ficheKey];
    }

    function setMode(m) {
      currentMode = m;
      renderHome();
    }

    function renderBreadcrumb(theme, sub) {
      let html = `<div class="breadcrumb"><span class="crumb" onclick="renderHome()">Accueil</span>`;
      if (theme) {
        const active = !sub;
        html += `<span class="sep">/</span><span class="crumb ${active ? 'active' : ''}" onclick="openTheme('${theme}')">${THEMES[theme].label}</span>`;
      }
      if (sub) {
        const label = THEMES[theme].children[sub].label;
        html += `<span class="sep">/</span><span class="crumb active">${label}</span>`;
      }
      html += `<span class="version-chip ${currentMode === 'house' ? 'v2' : 'v1'}">${currentMode === 'house' ? 'V2' : 'V1'}</span>`;
      html += `</div>`;
      return html;
    }

    function openTheme(key) {
      currentTheme = key; currentSubKey = null;
      searchOpen = false;
      updateHeaderSearchBtn();
      const t = THEMES[key];

      if (t.type === "categories") {
        let html = renderBreadcrumb(key, null);
        html += `<h2>${t.label}</h2>`;
        html += `<ul class="sublist">`;
        for (const sk in t.children) {
          const s = t.children[sk];
          const tag = hasHouseRule(key + ':' + sk) ? `<span class="tag-v2">V2</span>` : '';
          html += `
        <li onclick="openSub('${key}','${sk}')">
          <div class="left">
            <div class="emoji">${s.emoji}</div>
            <div><div class="name">${s.label}${tag}</div><div class="hint">${s.hint}</div></div>
          </div>
          <div class="chevron">›</div>
        </li>`;
        }
        html += `</ul>`;
        document.getElementById('main').innerHTML = html;
        return;
      }

      const breadcrumb = renderBreadcrumb(key, null);
      renderFicheContainer(key, breadcrumb, renderDirectContent(key), t.label);
    }

    function openSub(theme, sub) {
      currentTheme = theme; currentSubKey = sub;
      searchOpen = false;
      updateHeaderSearchBtn();
      const breadcrumb = renderBreadcrumb(theme, sub);
      const ficheKey = theme + ':' + sub;
      renderFicheContainer(ficheKey, breadcrumb, renderSubContent(theme, sub), THEMES[theme].children[sub].label);
    }

    function renderFicheContainer(ficheKey, breadcrumbHtml, officialHtml, ficheLabel) {
      const houseHtml = HOUSE_RULES[ficheKey];
      let bodyHtml;
      if (currentMode === 'house' && houseHtml) {
        bodyHtml = `<h2>${ficheLabel} <span class="house-badge" style="margin-left:8px; vertical-align:middle;">V2</span></h2>` + houseHtml;
      } else {
        bodyHtml = officialHtml;
      }
      document.getElementById('main').innerHTML = breadcrumbHtml + bodyHtml;
    }

        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Mélangez les cartes Arme Légendaire et piochez-en 5.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Ajoutez ces cartes Transposé et Légendaire au paquet trésor existant, puis mélangez le tout.</div></div>
      </div>
      <div class="note"><strong>Repos gratuit</strong> : une fois les personnages replacés sur la tuile Feu de Camp, ils se reposent immédiatement (Fioles, Chance et Action Héroïque restaurés) <b>sans dépenser d'étincelle</b> avant de repartir explorer.</div>`;
      }

      if (sub === "decor") {
        return `
      <h2>Décor</h2>
      <div class="section-label">Coffres</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Placés face <b>fermée</b> visible, ils <b>bloquent les déplacements</b> (comme un tonneau, mais ne se détruisent pas au passage).</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Si le groupe <b>vainc la rencontre</b>, il peut ouvrir le coffre : retournez le jeton face ouverte et piochez <b>immédiatement 2 cartes</b> du paquet de trésor.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Un personnage qui remplit les caractéristiques peut équiper aussitôt l'objet révélé ; sinon il va dans l'inventaire.</div></div>
        <div class="flow-step"><div class="flow-num">04</div><div class="flow-text">Une fois ouvert, un coffre ne se referme <b>jamais</b> — même après un repos au feu de camp.</div></div>
      </div>
      <div class="section-label">Jetons Piège</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Si la carte Rencontre a une icône Piège, un jeton face cachée est placé sur <b>chaque repère de base</b>, sauf ceux adjacents à un mur avec porte.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">La <b>première fois</b> qu'un personnage se déplace sur ce repère, retournez le jeton. Vierge = rien. Sinon, il subit le dégât indiqué (ou tente d'esquiver).</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Un dégât de piège <b>ne peut jamais être bloqué</b> par la Parade — seule l'Esquive fonctionne contre un piège.</div></div>
        <div class="flow-step"><div class="flow-num">04</div><div class="flow-text">Les pièges ne se déclenchent qu'<b>une fois</b> par rencontre et n'affectent <b>jamais les ennemis</b>.</div></div>
      </div>`;
      }

      if (sub === "ressources") {
        return `
      <h2>Action Héroïque / Chance / Estus</h2>
      <p style="color:var(--muted); font-size:0.82rem; margin:8px 0 14px;">Trois ressources à usage unique, rechargées uniquement par un repos au feu de camp.</p>
      <div class="action">
        <div class="title">${glyph("amelioration")} Action Héroïque</div>
        <div class="desc">Capacité spéciale propre à chaque classe, utilisable pendant une rencontre. Une fois utilisée, le jeton passe côté "utilisé" et n'est plus disponible jusqu'au prochain repos.</div>
      </div>
      <div class="action">
        <div class="title">🍀 Chance</div>
        <div class="desc">Permet de <b>relancer un dé</b> d'un jet d'attaque, de Parade, <b>ou</b> d'Esquive. Usage unique — une fois utilisé, indisponible jusqu'au prochain repos (ou rechargeable pour 1 âme auprès de la Gardienne du Feu).</div>
      </div>
      <div class="action">
        <div class="title">🧪 Fiole d'Estus</div>
        <div class="desc">Pendant ton activation, retire <b>tous les cubes noirs ET rouges</b> de ta barre d'endurance d'un coup — recharge l'Énergie et soigne complètement en même temps. Usage unique jusqu'au prochain repos.</div>
      </div>
      <div class="note"><strong>Un seul de chaque</strong> : chaque personnage ne possède qu'1 jeton Action Héroïque, 1 Chance, 1 Estus — impossible d'en cumuler plusieurs.</div>`;
      }

      if (sub === "fin") {
        return `
      <h2>Fin de rencontre</h2>
      <div class="section-label">Victoire</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Retirez tous les cubes noirs et rouges des barres d'endurance des personnages.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Rencontre normale : <b>+2 âmes par personnage</b> dans la cache d'âme.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Rencontre Boss : <b>+1 âme par personnage, par étincelle restante</b> au feu de camp.</div></div>
      </div>
      <div class="section-label">Défaite (un personnage meurt)</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Le groupe entier est vaincu. Tous les personnages retournent sur la tuile Feu de Camp.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Tous les jetons Âme de la cache sont placés sur le repère où le personnage est mort.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Le groupe doit se reposer au feu de camp (voir fiche Feu de camp).</div></div>
        <div class="flow-step"><div class="flow-num">04</div><div class="flow-text">Pour récupérer ces âmes, un personnage doit se déplacer sur ce repère plus tard — s'il meurt avant, elles sont <b>défaussées définitivement</b>.</div></div>
      </div>
      <div class="note warn"><strong>Pas d'échappatoire</strong> : une fois lancé dans une rencontre, le groupe ne peut pas la quitter avant victoire ou défaite complète.</div>
      <div class="note"><strong>Jeton Première Activation</strong> : quelle que soit l'issue, il est donné au joueur qui aurait dû activer son personnage ensuite — il ouvrira la prochaine rencontre.</div>`;
      }

      if (sub === "des") {
        return `
      <h2>Les dés</h2>
      <p style="color:var(--muted); font-size:0.82rem; margin:8px 0 14px;">4 couleurs, chaque carte équipement/ennemi indique lesquels lancer.</p>
      <div class="action">
        <div class="title"><span class="die die-noir">●</span> Dé noir</div>
        <div class="desc">Le plus courant. Utilisé pour la majorité des attaques de base et les jets de Parade.</div>
      </div>
      <div class="action">
        <div class="title"><span class="die die-bleu">●</span> Dé bleu</div>
        <div class="desc">Attaques renforcées ou magiques, et jets de Résistance.</div>
      </div>
      <div class="action">
        <div class="title"><span class="die die-orange">●</span> Dé orange</div>
        <div class="desc">Le plus rare (2 seulement) — grosses attaques, souvent côté ennemis/boss.</div>
      </div>
      <div class="action">
        <div class="title"><span class="die die-vert">●</span> Dé vert</div>
        <div class="desc">Dédié à l'Esquive uniquement — jamais utilisé pour attaquer.</div>
      </div>
      <div class="note"><strong>Lecture d'une carte</strong> : le nombre et la couleur des dés à côté d'une action d'équipement indiquent exactement quoi lancer, ex. <span class="die die-noir">2</span> = lancer deux dés noirs.</div>`;
      }

      if (sub === "portee") {
        return `
      <h2>Portée</h2>
      <p style="color:var(--muted); font-size:0.82rem; margin:8px 0 14px;">Distance maximale mesurée en repères, entre attaquant et cible.</p>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">0</div><div class="flow-text">La cible doit être sur <b>le même repère</b> que l'attaquant.</div></div>
        <div class="flow-step"><div class="flow-num">1</div><div class="flow-text">La cible doit être sur un repère <b>adjacent</b>.</div></div>
        <div class="flow-step"><div class="flow-num">2</div><div class="flow-text">La cible peut être séparée par <b>deux</b> repères (et ainsi de suite pour les portées plus élevées).</div></div>
        <div class="flow-step"><div class="flow-num">∞</div><div class="flow-text">Portée <b>illimitée</b> — peut affecter n'importe quelle figurine de la rencontre.</div></div>
      </div>
      <div class="note"><strong>Bon à savoir</strong> : certaines options d'arme remplacent la portée de base de l'équipement (indiqué directement sur l'action). Les arcs et armes d'hast (icône flèche) ne peuvent généralement pas être utilisés à Portée 0.</div>`;
      }

      if (sub === "etats") {
        return `
      <h2>États négatifs</h2>
      <p style="color:var(--muted); font-size:0.82rem; margin:8px 0 14px;">Une figurine ne peut porter qu'un seul jeton de chaque condition à la fois.</p>
      <div class="action">
        <div class="title">${glyph("saignement")} Saignement</div>
        <div class="desc">Au <b>prochain dégât subi</b>, +2 dégâts supplémentaires. Le jeton est ensuite retiré (effet unique, se déclenche une fois puis disparaît).</div>
      </div>
      <div class="action">
        <div class="title">${glyph("poison")} Poison</div>
        <div class="desc">À la <b>fin de chaque activation</b> de la figurine, elle subit 1 dégât tant qu'elle porte le jeton.</div>
      </div>
      <div class="action">
        <div class="title">${glyph("gelure")} Gelure</div>
        <div class="desc"><b>Personnage</b> : +1 Énergie à chaque marche/course/esquive. <b>Ennemi</b> : sa valeur de déplacement est réduite de 1.</div>
      </div>
      <div class="action">
        <div class="title">${glyph("flechir")} Fléchir</div>
        <div class="desc"><b>Personnage</b> : +1 Énergie pour utiliser une action d'arme. <b>Ennemi</b> : ses valeurs de dégâts d'attaque sont réduites de 1.</div>
      </div>
      <div class="note"><strong>Quand ça part</strong> : Poison, Gelure et Fléchir sont retirés à la <b>fin de l'activation</b> de la figurine qui les porte. Tous les jetons condition restants sont aussi retirés à la <b>fin de la rencontre</b>.</div>
      <div class="note"><strong>Ordre d'application</strong> : le livret V1 ne précise pas explicitement l'ordre entre dégâts et conditions. La clarification officielle des développeurs (reprise dans les éditions suivantes) : <b>résoudre les dégâts d'abord</b> (y compris le bonus d'un Saignement déjà présent), <b>puis</b> appliquer les nouvelles conditions de l'attaque — même si l'attaque a fait 0 dégât. Ex. : une figurine déjà en Saignement touchée par une nouvelle attaque qui inflige aussi Saignement subit d'abord le +2 de l'ancien jeton (qui est ensuite retiré), puis reçoit le nouveau jeton Saignement.</div>`;
      }

      if (sub === "aggro") {
        return `
      <h2>Aggro</h2>
      <p style="color:var(--muted); font-size:0.82rem; margin:8px 0 4px;">Le jeton Aggro détermine qui les ennemis visent en priorité.</p>
      <div class="section-label">Qui le porte ?</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Au début d'une rencontre, il est placé sur le personnage choisi pour <b>ouvrir la voie</b>.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Il <b>change de porteur à chaque activation</b> : dès qu'un personnage commence son activation, il reçoit automatiquement le jeton Aggro.</div></div>
      </div>
      <div class="section-label">Comment les ennemis ciblent</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Certaines attaques/déplacements ciblent <b>directement</b> le personnage avec l'Aggro, quelle que soit sa position (sous réserve d'être à portée).</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">D'autres ciblent le personnage <b>le plus proche</b>. En cas d'égalité de distance entre plusieurs personnages, l'ennemi cible celui qui a l'<b>Aggro</b>.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Si le porteur de l'Aggro n'est pas parmi les plus proches à égalité, l'ennemi cible plutôt le personnage avec le plus haut <b>niveau de Provocation</b> (indiqué sur la fiche perso).</div></div>
        <div class="flow-step"><div class="flow-num">04</div><div class="flow-text">Si aucun personnage n'est à portée, l'attaque échoue simplement — sans effet.</div></div>
      </div>
      <div class="note"><strong>Astuce tactique</strong> : comme l'Aggro change à chaque activation, c'est souvent la figurine qui vient de jouer (donc probablement déjà positionnée agressivement) qui devient la cible prioritaire du tour ennemi suivant.</div>`;
      }

      if (sub === "deplacements") {
        return `
      <h2>Déplacements</h2>
      <p style="color:var(--muted); font-size:0.82rem; margin:8px 0 4px;">Trois façons de bouger pendant une activation.</p>
      <div class="action">
        <div class="title">Marcher <span class="cost" style="color:var(--muted); border-color:var(--card-border);">0 Énergie</span></div>
        <div class="desc"><b>Une seule fois</b> par activation : déplacement de 1 repère, gratuit.</div>
      </div>
      <div class="action">
        <div class="title">Courir <span class="cost">1 Énergie</span></div>
        <div class="desc">Un <b>nombre illimité</b> de fois par activation : chaque déplacement de 1 repère coûte 1 Énergie.</div>
      </div>
      <div class="action">
        <div class="title">Esquiver <span class="cost">1 Énergie</span></div>
        <div class="desc">Uniquement pendant l'activation d'un <b>ennemi</b>, quand tu es attaqué : déplacement de 1 repère + jet de dés d'esquive (voir fiche Parade/Esquive). Une esquive réussie = 0 dégât et non touché.</div>
      </div>
      <div class="section-label">À retenir</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Tu peux te déplacer <b>avant ou après</b> ton attaque, mais pas les deux (un seul "moment" de déplacement par activation, potentiellement en plusieurs pas).</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Un déplacement de <b>poussée</b> (subi, pas choisi) ne coûte jamais d'Énergie — voir fiche Push.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Certaines conditions augmentent le coût : <b>Gelure</b> ajoute 1 Énergie à chaque marche/course/esquive ; un tonneau sur le chemin ajoute aussi 1 Énergie pour le traverser (et le détruit).</div></div>
      </div>`;
      }

      if (sub === "attaquer") {
        return `
      <h2>Attaquer</h2>
      <p style="color:var(--muted); font-size:0.82rem; margin:8px 0 4px;">Pendant son activation, un personnage peut effectuer jusqu'à une attaque avec chaque arme dans ses emplacements main.</p>
      <div class="section-label">Cibler et choisir l'attaque</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Le personnage cible un <b>ennemi à portée</b> de l'une de ses armes.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Il choisit une des <b>options d'attaque</b> de cette arme, et dépense un nombre d'Énergies égal au coût indiqué.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Il lance la quantité et la couleur de dés indiquées sur l'attaque choisie. Chaque point obtenu représente <b>1 dégât</b>.</div></div>
      </div>
      <div class="note">Exemple : le Shortsword a deux options d'attaque — pour <b>0 Énergie</b>, lancer <span class="die die-noir">2</span> ; pour <b>2 Énergies</b>, lancer <span class="die die-noir">3</span>.</div>

      <div class="section-label">Type de dégâts</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">La plupart des armes infligent des dégâts <b>physiques</b> : on déduit la valeur de <b>Parade</b> de la cible du total.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Les sorts et armes élémentaires infligent des dégâts <b>magiques</b> : on déduit la valeur de <b>Résistance</b> de la cible du total.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Si la Parade ou la Résistance de l'ennemi égale ou dépasse le total de dégâts, l'ennemi subit <b>0 dégât</b> — mais reste touché.</div></div>
      </div>

      <div class="section-label">Résolution</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">L'ennemi subit les dégâts restants après déduction. Placez sous lui un jeton blessure par point de dégât subi.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Si le total de jetons blessure égale ou dépasse sa <b>Santé de Départ</b>, il est vaincu : retirez la figurine et ses jetons blessure de la tuile.</div></div>
      </div>

      <div class="note"><strong>Touché ≠ dégât</strong> : même à 0 dégât grâce à la Parade ou la Résistance, l'ennemi reste "touché" et peut donc être poussé ou subir une condition si l'attaque en inflige une.</div>`;
      }

      if (sub === "tour") {
        return `
      <h2>Déroulement des tours</h2>
      <div class="section-label">Qui joue en premier ?</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Une rencontre commence <b>toujours par les ennemis</b> qui s'activent, avant le premier personnage.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Ensuite l'ordre alterne : <b>Ennemis → 1 personnage → Ennemis → 1 personnage</b>… jusqu'à ce que tous les personnages soient passés, puis ça recommence.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Tout au long d'une rencontre, un <b>seul</b> personnage s'active à la fois — jamais deux d'affilée.</div></div>
      </div>

      <div class="section-label">Quel personnage commence ?</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">À la <b>toute première</b> rencontre de la partie, les joueurs choisissent librement quel personnage s'active en premier.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Ensuite, l'ordre des personnages suit le <b>sens horaire</b> autour de la table.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">À chaque <b>nouvelle</b> rencontre, le premier personnage à s'activer est celui qui aurait dû jouer ensuite si la rencontre précédente avait continué (peu importe victoire ou défaite) — repérez-le avec le jeton <b>Première Activation</b>.</div></div>
      </div>

      <div class="section-label">Ordre des ennemis entre eux</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Toutes les figurines ennemies s'activent <b>ensemble</b> à chaque "tour ennemi", mais dans un ordre précis.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Elles s'activent du <b>niveau de Menace le plus haut au plus bas</b>. À menace égale, les joueurs choisissent l'ordre.</div></div>
      </div>

      <div class="section-label">Au début de ton activation</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Tu gagnes <b>2 Énergies</b> (retire jusqu'à 2 cubes noirs de ta barre d'endurance).</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Tu reçois le jeton <b>Aggro</b> (les ennemis te cibleront en priorité, voir fiche Attaques).</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Tu peux échanger librement des objets entre ta <b>position de secours</b> et tes emplacements main.</div></div>
        <div class="flow-step"><div class="flow-num">04</div><div class="flow-text">Puis tu peux te déplacer et/ou attaquer (une seule fois chaque, dans l'ordre de ton choix), avant que ton activation se termine.</div></div>
      </div>
      <div class="note"><strong>Énergie non dépensée</strong> : elle ne se garde pas pour le tour suivant au-delà de ce qui est déjà retiré de la barre — chaque activation te redonne simplement 2 Énergies de plus (jusqu'à ce que la barre soit pleine de cubes rouges de dégâts, auquel cas le gain est perdu).</div>`;
      }

      if (sub === "push") {
        return `
      <h2>Push</h2>
      <div class="section-label">Principe de base</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Un <b>déplacement de poussée ne coûte pas d'Énergie</b>.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">La figurine poussée par une <b>attaque</b> est déplacée sur le repère adjacent <b>le plus éloigné</b> de l'attaquant, au choix des joueurs.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Si l'icône Poussée apparaît sur le <b>déplacement</b> d'un ennemi : chaque personnage sur le repère où l'ennemi arrive est poussé sur un repère adjacent au choix des joueurs — et ce à <b>chaque repère traversé</b> si l'ennemi se déplace de plusieurs cases.</div></div>
      </div>
      <div class="section-label">Boss</div>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Une figurine <b>Boss ne peut pas être poussée</b> par l'attaque ou le déplacement d'un personnage.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Un Boss peut uniquement être poussé par un <b>autre Boss</b> qui se déplace sur son repère (rencontres à plusieurs Boss).</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Tous les <b>sauts</b> de Boss possèdent l'icône Poussée : les personnages sur le chemin peuvent être poussés sur n'importe quel repère adjacent, sans être liés à un arc particulier.</div></div>
      </div>
      <div class="note"><strong>Limite de figurines</strong> : un repère ne peut contenir plus de 3 figurines (1 seule pour un Boss). Si une figurine arrive sur un repère plein, il faut pousser une figurine déjà présente.</div>`;
      }

      if (sub === "tonneaux") {
        return `
      <h2>Tonneaux</h2>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Les Tonneaux <b>bloquent les déplacements et les poussées</b> tant qu'ils sont intacts.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Un personnage peut marcher, courir ou esquiver sur un repère avec un tonneau, mais doit dépenser <b>1 Énergie supplémentaire</b> pour ce faire.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Ce faisant, le tonneau est <b>détruit</b> (retournez le jeton face détruite) : il ne bloque plus rien pour le reste de la rencontre.</div></div>
        <div class="flow-step"><div class="flow-num">04</div><div class="flow-text">À la fin de la rencontre, tous les tonneaux repassent face intacte visible, au cas où la rencontre serait rejouée.</div></div>
      </div>`;
      }

      if (sub === "steles") {
        return `
      <h2>Stèles</h2>
      <div class="flow">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Les Stèles <b>bloquent les déplacements</b> — elles ne se détruisent jamais (contrairement aux tonneaux).</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Au début d'une <b>rencontre Boss</b>, le groupe révèle au hasard une carte de Comportement du Boss pour chaque stèle présente sur une tuile dont la carte Rencontre est face visible.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">C'est donc un indice tactique : plus vous avez exploré de tuiles avec stèles, plus vous connaissez le comportement du boss avant de l'affronter.</div></div>
      </div>`;
      }

      if (sub === "endurance") {
        return `
      <h2>Endurance / dégâts</h2>
      <p style="color:var(--muted); font-size:0.82rem; margin:8px 0 4px;">Une seule barre de 10 cases sert à la fois d'Énergie et de Vie.</p>
      <div class="stat-pair">
        <div class="stat-box"><div class="lbl">Énergie dépensée</div><div class="val">Cube noir</div></div>
        <div class="stat-box"><div class="lbl">Dégât subi</div><div class="val">Cube rouge</div></div>
      </div>
      <div class="flow" style="margin-top:16px;">
        <div class="flow-step"><div class="flow-num">01</div><div class="flow-text">Énergie dépensée → cube <b>noir</b>, placé en partant de la <b>gauche</b>.</div></div>
        <div class="flow-step"><div class="flow-num">02</div><div class="flow-text">Dégât subi → cube <b>rouge</b>, placé en partant de la <b>droite</b>.</div></div>
        <div class="flow-step"><div class="flow-num">03</div><div class="flow-text">Si les <b>10 cases sont remplies</b>, le personnage est tué et le groupe est immédiatement vaincu.</div></div>
        <div class="flow-step"><div class="flow-num">04</div><div class="flow-text">Gagner de l'Énergie/Vie retire des cubes correspondants ; si aucun cube à retirer, le gain est perdu.</div></div>
      </div>
      <div class="note"><strong>Fiole d'Estus</strong> : retire tous les cubes noirs et rouges d'un coup (usage unique jusqu'au prochain repos au feu).</div>`;
      }

      if (sub === "esquive") {
        return `
      <h2>Parade / Esquive</h2>
      <div class="section-label">Deux façons de se défendre</div>
      <div class="action">
        <div class="title">Parade / Résistance</div>
        <div class="desc">Réduit les dégâts sans les annuler forcément. Lancez les dés <span class="die die-noir">●</span>/<span class="die die-bleu">●</span> indiqués par les icônes Parade (physique) ou Résistance (magique) de votre équipement, soustrayez le total à la force de l'attaque. Si le lancer égale ou dépasse l'attaque : 0 dégât.</div>
      </div>
      <div class="action">
        <div class="title">Esquive</div>
        <div class="desc">Tout ou rien — remplace le jet de Parade/Résistance. Coûte 1 Énergie, permet de se déplacer de 1 repère. Lancez vos dés <span class="die die-vert">●</span> : si le nombre d'icônes Esquive obtenu égale/dépasse la difficulté d'esquive, 0 dégât <b>et</b> non touché (pas de poussée, pas de condition). Sinon : dégâts complets.</div>
      </div>
      <div class="note"><strong>Touché ≠ dégât</strong> : même à 0 dégât grâce à la Parade, un personnage reste "touché" et peut être poussé ou subir une condition. Seule une esquive réussie évite complètement d'être touché.</div>`;
      }
      return "";
    }

    function toggle(el) { el.classList.toggle('done'); }

    renderHome();

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => { /* pas grave, l'app fonctionne quand même en ligne */ });
      });
    }

    const container = document.getElementById('embers');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'ember-particle';
      const left = Math.random() * 100;
      const dur = 6 + Math.random() * 8;
      const delay = Math.random() * 10;
      const drift = (Math.random() * 40 - 20) + 'px';
      p.style.left = left + 'vw';
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = delay + 's';
      p.style.setProperty('--drift', drift);
      container.appendChild(p);
    }
  </script>

</body>

</html>
